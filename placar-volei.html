<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Placar Vôlei — Torneio 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --sand:#EFE4CC;
  --navy:#0F2A3D;
  --navy-deep:#091C29;
  --coral:#FF6B4A;
  --gold:#F2B134;
  --silver:#B9C4CC;
  --bronze:#C98A4B;
  --bad:#D64550;
  --ink:#0F2A3D;
  --white:#FCFAF4;
  --line: rgba(15,42,61,.14);
  --good-tint: rgba(60,150,110,.14);
  --good-line: #3C966E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--sand);color:var(--ink);font-family:'Manrope',sans-serif;}
body{padding-bottom:76px;}
h1,h2,h3{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.02em; margin:0;}
button{font-family:inherit; cursor:pointer;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--sand);position:relative;}

/* Topbar */
.topbar{background:var(--navy); color:var(--white); padding:18px 18px 14px; position:sticky; top:0; z-index:20;}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.topbar .ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--coral), #b8412a); flex:none;box-shadow: inset -3px -3px 0 rgba(0,0,0,.15);}
.topbar h1{font-size:22px; color:var(--white);}
.topbar .sub{font-size:11px; opacity:.65; text-transform:uppercase; letter-spacing:.12em; margin-top:2px;}

/* Tabs */
.tabs{display:flex; background:var(--navy-deep); position:sticky; top:70px; z-index:19; overflow-x:auto;}
.tab{flex:1; text-align:center; padding:11px 6px; font-size:11.5px; font-weight:700; color:rgba(255,255,255,.5); border-bottom:3px solid transparent; white-space:nowrap; text-transform:uppercase; letter-spacing:.04em;}
.tab.active{color:var(--white); border-bottom-color:var(--coral);}

.content{padding:16px;}

/* Cards */
.card{background:var(--white); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 var(--line); border:1px solid var(--line);}
.card h3{font-size:15px; margin-bottom:10px; color:var(--navy);}
.muted{color:rgba(15,42,61,.55); font-size:13px;}
.empty{text-align:center; padding:34px 16px; color:rgba(15,42,61,.5);}
.empty .big{font-size:34px; margin-bottom:6px;}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:12px 16px; font-weight:700; font-size:14px;}
.btn-primary{background:var(--coral); color:#fff; width:100%;}
.btn-primary:active{background:#e6552f;}
.btn-ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
.btn-navy{background:var(--navy); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px; font-size:12.5px; border-radius:8px;}
.btn-danger{background:transparent;color:var(--bad); border:1.5px solid rgba(214,69,80,.35);}
.btn:disabled{opacity:.4;}

/* Forms */
label{display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:rgba(15,42,61,.6); margin:12px 0 6px;}
label:first-child{margin-top:0;}
input[type=text], select{width:100%; padding:11px 12px; border-radius:9px; border:1.5px solid var(--line); font-size:15px; background:#fff; font-family:inherit; color:var(--ink);}
.gender-row{display:flex; gap:8px;}
.gender-opt{flex:1; text-align:center; padding:10px; border-radius:9px; border:1.5px solid var(--line); font-weight:700; font-size:13px; background:#fff;}
.gender-opt.selected-M{background:var(--navy); color:#fff; border-color:var(--navy);}
.gender-opt.selected-F{background:var(--coral); color:#fff; border-color:var(--coral);}

/* Roster list */
.team-group{margin-bottom:14px;}
.team-group h4{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:rgba(15,42,61,.55); margin-bottom:6px;}
.player-row{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line);}
.player-row:last-child{border-bottom:none;}
.player-name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px;}
.gender-badge{font-size:10px; font-weight:800; width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff;}
.gender-badge.M{background:var(--navy);}
.gender-badge.F{background:var(--coral);}
.icon-btn{background:none;border:none;color:rgba(15,42,61,.4); font-size:16px; padding:4px 8px;}

/* Scoreboard */
.scoreboard{background:var(--navy); border-radius:16px; padding:18px; color:#fff; margin-bottom:14px;}
.sb-teams{display:flex; align-items:center; justify-content:space-between;}
.sb-team{flex:1; text-align:center;}
.sb-team .name{font-size:12px; text-transform:uppercase; letter-spacing:.05em; opacity:.75; margin-bottom:4px; font-weight:700;}
.sb-score{font-family:'Anton',sans-serif; font-size:56px; line-height:1;}
.sb-vs{font-size:11px; opacity:.5; padding:0 10px; font-weight:700;}
.sb-sets{text-align:center; margin-top:10px; font-size:12px; opacity:.7; letter-spacing:.04em;}
.sb-setpills{display:flex; justify-content:center; gap:6px; margin-top:8px;}
.set-pill{font-size:11px; background:rgba(255,255,255,.12); padding:4px 9px; border-radius:20px;}

/* Event grid */
.evt-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:6px;}
.evt-btn{padding:14px 8px; border-radius:12px; border:1.5px solid var(--line); background:#fff; text-align:center; font-weight:700; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:4px;}
.evt-btn .emoji{font-size:20px;}
.evt-btn.good{border-color:var(--good-line); color:var(--good-line);}
.evt-btn.bad{border-color:var(--bad); color:var(--bad);}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(9,28,41,.55); z-index:50; display:flex; align-items:flex-end;}
.modal{background:var(--white); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px; max-height:82vh; overflow-y:auto; animation:slideup .18s ease-out;}
@keyframes slideup{from{transform:translateY(16px); opacity:.4} to{transform:translateY(0); opacity:1}}
.modal h3{margin-bottom:4px;}
.modal .modal-sub{font-size:12.5px; color:rgba(15,42,61,.55); margin-bottom:14px;}
.modal-close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:rgba(15,42,61,.4);}
.pick-list{display:flex; flex-direction:column; gap:8px;}
.pick-row{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:#fff; font-weight:700; font-size:14.5px;}
.pick-row .team-tag{font-size:10.5px; font-weight:700; color:rgba(15,42,61,.5); text-transform:uppercase;}

/* Stats / awards */
.award-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.award-card{background:#fff; border-radius:12px; padding:12px; border:1px solid var(--line);}
.award-card.bad-award{background:#FDF1F1;}
.award-card .a-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:800; color:rgba(15,42,61,.5); margin-bottom:8px;}
.award-card .a-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0;}
.award-card .a-row .medal{width:16px; display:inline-block;}
.award-card .a-row .aname{flex:1; font-weight:700; margin-left:2px;}
.award-card .a-row .aval{font-weight:800; color:var(--navy);}
.bad-award .a-row .aval{color:var(--bad);}

table.stat-table{width:100%; border-collapse:collapse; font-size:12px;}
table.stat-table th{text-align:center; font-size:9.5px; text-transform:uppercase; color:rgba(15,42,61,.5); padding:6px 3px; position:sticky; top:0; background:var(--white);}
table.stat-table th:first-child, table.stat-table td:first-child{text-align:left; position:sticky; left:0; background:var(--white); z-index:2;}
table.stat-table td{text-align:center; padding:7px 3px; border-top:1px solid var(--line); font-weight:600;}
.table-scroll{overflow-x:auto; max-width:100%;}
.rank-1{background:rgba(242,177,52,.35); border-radius:6px;}
.rank-2{background:rgba(185,196,204,.4); border-radius:6px;}
.rank-3{background:rgba(201,138,75,.3); border-radius:6px;}
.badrank-1{background:rgba(214,69,80,.28); border-radius:6px;}
.badrank-2{background:rgba(214,69,80,.16); border-radius:6px;}
.badrank-3{background:rgba(214,69,80,.09); border-radius:6px;}

/* Standings */
.standing-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line);}
.standing-row:last-child{border-bottom:none;}
.standing-row .pos{width:26px; font-family:'Anton',sans-serif; color:rgba(15,42,61,.4); font-size:16px;}
.standing-row .tname{flex:1; font-weight:700;}
.standing-row .wins{font-family:'Anton',sans-serif; font-size:20px; color:var(--navy);}

/* Fixed bottom actions */
.fab-bar{position:fixed; bottom:0; left:0; right:0; background:var(--white); border-top:1px solid var(--line); padding:12px 16px; max-width:520px; margin:0 auto; z-index:15;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.2);}

.log-item{font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;}
.log-item .lt{color:rgba(15,42,61,.5);}
.section-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; color:rgba(15,42,61,.5); margin:18px 0 8px;}
.section-title:first-child{margin-top:0;}

/* Public viewer + role picker */
.card.clickable{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
.tourn-name{font-weight:800; font-size:15px;}
.chevron{color:rgba(15,42,61,.3); font-size:20px;}
.match-row{padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px; font-weight:700;}
.match-row:last-child{border-bottom:none;}
.match-row .win{color:var(--navy);}
.updated{text-align:center; font-size:11px; color:rgba(15,42,61,.45); margin-top:4px;}
.role-card{background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:20px; margin-bottom:12px; text-align:center;}
.role-card .big{font-size:32px; margin-bottom:8px;}
.role-card h3{margin-bottom:6px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){

const GENDERS = {M:'Masculino', F:'Feminino'};
const EVENT_TYPES = {
  ace:        {label:'Ace',            emoji:'🔥', good:true,  stat:'aces',        point:'self'},
  attack:     {label:'Ataque (ponto)', emoji:'💥', good:true,  stat:'attacksGood', point:'self'},
  block:      {label:'Bloqueio',       emoji:'🧱', good:true,  stat:'blocks',      point:'self'},
  drop:       {label:'Largada/Outros', emoji:'🎯', good:true,  stat:'drops',       point:'self'},
  attackError:{label:'Erro de Ataque', emoji:'❌', good:false, stat:'attacksBad',  point:'opponent'},
  serveError: {label:'Erro de Saque',  emoji:'🚫', good:false, stat:'serveErrors', point:'opponent'},
  netTouch:   {label:'Toque na Rede',  emoji:'🕸️', good:false, stat:'netTouches',  point:'opponent'}
};
const STAT_KEYS = ['points','aces','attacksGood','attacksBad','blocks','netTouches','serveErrors','mishits','drops','mvp'];
function emptyStats(){ return {points:0,aces:0,attacksGood:0,attacksBad:0,blocks:0,netTouches:0,serveErrors:0,mishits:0,drops:0,mvp:0}; }

function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1800);
}

/* ---------- SELETOR DE MODO ---------- */
function getRole(){ return localStorage.getItem('volei_role'); }
function setRole(r){ localStorage.setItem('volei_role', r); }
function renderRolePicker(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="topbar"><div class="brand"><div class="ball"></div><h1>Placar Vôlei</h1></div><div class="sub">Como você quer entrar?</div></div>
  <div class="content" style="padding-top:30px;">
    <div class="role-card" data-action="chooseRole" data-role="viewer">
      <div class="big">👀</div>
      <h3>Só quero acompanhar</h3>
      <div class="muted">Ver a classificação e os resultados dos torneios</div>
    </div>
    <div class="role-card" data-action="chooseRole" data-role="admin">
      <div class="big">🏐</div>
      <h3>Sou organizador(a)</h3>
      <div class="muted">Cadastrar times, marcar pontos e ver estatísticas</div>
    </div>
  </div>`;
  app.querySelectorAll('[data-action="chooseRole"]').forEach(el=>{
    el.onclick = ()=>{ setRole(el.dataset.role); boot(); };
  });
}
function switchRole(){
  localStorage.removeItem('volei_role');
  Public.stopPolling();
  boot();
}
function boot(){
  const role = getRole();
  if(!role){ renderRolePicker(); return; }
  if(role==='admin'){ load(); }
  else { Public.load(); }
}

function defaultState(){
  return {
    tab:'elenco',
    roster:[],
    playerStats:{},
    standings:{},
    history:[],
    current:null,
    modal:null,
    updatedAt:null,
    jsonbin:{id:''},            // bin de publicação pública deste torneio (classificação)
    sync:{binId:''}            // sincronização privada (torneio completo)
  };
}
let state = defaultState();
let currentEventId = null;
let syncTimer = null;

function uid(){ return Math.random().toString(36).slice(2,10); }

function getEvents(){
  try{ return JSON.parse(localStorage.getItem('volei_events')||'[]'); }catch(e){ return []; }
}
function saveEvents(list){ localStorage.setItem('volei_events', JSON.stringify(list)); }

async function load(){
  currentEventId = localStorage.getItem('volei_current_event') || null;
  if(currentEventId){
    loadEventState(currentEventId);
    render();
    await pullCloudIfNewer();
  } else {
    render();
  }
}
function loadEventState(id){
  state = defaultState();
  try{
    const raw = localStorage.getItem('volei_state_'+id);
    if(raw){ state = Object.assign(state, JSON.parse(raw)); }
  }catch(e){ /* torneio novo, tudo bem */ }
}
function save(){
  if(!currentEventId) return;
  state.updatedAt = new Date().toISOString();
  try{
    localStorage.setItem('volei_state_'+currentEventId, JSON.stringify(state));
  }catch(e){
    console.warn('Não foi possível salvar agora.', e);
    toast('⚠️ Não foi possível salvar automaticamente. Use o backup manual na aba Histórico.');
  }
  scheduleCloudSync();
}

/* ---------- SINCRONIZAÇÃO ENTRE APARELHOS (jsonbin privado) ---------- */
function scheduleCloudSync(){
  if(!state.sync.binId || !getJsonbinKey()) return;
  if(!navigator.onLine) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushCloud, 4000);
}
async function pushCloud(){
  const key = getJsonbinKey(), id = state.sync.binId;
  if(!key || !id) return;
  try{
    await fetch('https://api.jsonbin.io/v3/b/'+id, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':key},
      body: JSON.stringify({eventName: currentEventName(), updatedAt: state.updatedAt, state})
    });
  }catch(e){ /* tentará de novo na próxima alteração */ }
}
async function pullCloudIfNewer(){
  const key = getJsonbinKey(), id = state.sync.binId;
  if(!key || !id) return;
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+id+'/latest', {headers:{'X-Master-Key':key}});
    const data = await res.json();
    const cloud = data && data.record;
    if(cloud && cloud.state && (!state.updatedAt || new Date(cloud.updatedAt) > new Date(state.updatedAt))){
      state = Object.assign(defaultState(), cloud.state);
      localStorage.setItem('volei_state_'+currentEventId, JSON.stringify(state));
      render();
      toast('🔄 Dados mais recentes da nuvem carregados');
    }
  }catch(e){ /* offline ou ainda não sincronizado, segue com o local */ }
}
async function activateSync(){
  const key = document.getElementById('jbKey').value.trim();
  if(!key){ toast('Cole sua Master Key primeiro'); return; }
  localStorage.setItem('volei_jsonbin_key', key);
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Private':'true','X-Bin-Name':'sync-'+currentEventName()},
      body: JSON.stringify({eventName: currentEventName(), updatedAt: state.updatedAt, state})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message||('HTTP '+res.status));
    state.sync.binId = data.metadata.id;
    save();
    render();
    toast('Sincronização ativada! Copie o código pra usar em outro aparelho.');
  }catch(e){
    toast('Erro ao ativar sincronização: verifique a Master Key.');
  }
}
async function importSyncedEvent(){
  const key = document.getElementById('impKey').value.trim();
  const code = document.getElementById('impCode').value.trim();
  if(!key || !code){ toast('Preencha a Master Key e o código de sincronização'); return; }
  localStorage.setItem('volei_jsonbin_key', key);
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+code+'/latest', {headers:{'X-Master-Key':key}});
    const data = await res.json();
    const cloud = data && data.record;
    if(!cloud || !cloud.state) throw new Error('Código não encontrado');
    const newId = uid();
    const events = getEvents();
    events.push({id:newId, name: cloud.eventName || 'Torneio importado', createdAt: new Date().toISOString()});
    saveEvents(events);
    state = Object.assign(defaultState(), cloud.state);
    state.sync.binId = code;
    currentEventId = newId;
    localStorage.setItem('volei_current_event', newId);
    localStorage.setItem('volei_state_'+newId, JSON.stringify(state));
    render();
    toast('Torneio importado com sucesso!');
  }catch(e){
    toast('Não foi possível importar: confira a Master Key e o código.');
  }
}

function teamsList(){
  const set = new Set(state.roster.map(p=>p.team).filter(Boolean));
  return Array.from(set).sort();
}
function playersOfTeam(team){
  return state.roster.filter(p=>p.team===team);
}
function getStats(id){
  if(!state.playerStats[id]) state.playerStats[id] = emptyStats();
  return state.playerStats[id];
}
function playerName(id){
  const p = state.roster.find(p=>p.id===id);
  return p ? p.name : '—';
}

function isUnlocked(){ return sessionStorage.getItem('volei_unlocked')==='1'; }
function getPin(){ return localStorage.getItem('volei_admin_pin'); }

/* ---------- RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  if(!isUnlocked()){ app.innerHTML = renderLock(); attachLockEvents(); return; }
  if(!currentEventId){ app.innerHTML = renderEventPicker(); attachEvents(); return; }
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="ball"></div><h1>Placar Vôlei</h1></div>
      <div class="sub"><span data-action="switchEvent" style="cursor:pointer;">${currentEventName()} · trocar torneio ↺</span> &nbsp;|&nbsp; <span data-action="switchRole" style="cursor:pointer;">trocar modo</span></div>
    </div>
    <div class="tabs">
      ${tabBtn('elenco','Elenco')}
      ${tabBtn('jogo','Jogo')}
      ${tabBtn('stats','Estatísticas')}
      ${tabBtn('times','Times')}
      ${tabBtn('historico','Histórico')}
    </div>
    <div class="content">${renderTab()}</div>
    ${state.modal ? renderModal() : ''}
  `;
  attachEvents();
}
function currentEventName(){
  const ev = getEvents().find(e=>e.id===currentEventId);
  return ev ? ev.name : 'Torneio';
}
function tabBtn(id,label){
  return `<div class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</div>`;
}

function renderEventPicker(){
  const events = getEvents();
  return `
  <div class="topbar"><div class="brand"><div class="ball"></div><h1>Placar Vôlei</h1></div><div class="sub" data-action="switchRole" style="cursor:pointer;">Selecione um torneio · trocar modo</div></div>
  <div class="content">
    ${events.length===0? `<div class="empty"><div class="big">🏐</div>Nenhum torneio cadastrado ainda.</div>` : events.map(ev=>`
      <div class="card" style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-weight:800; font-size:15px;">${ev.name}</div>
          <div class="muted">Criado em ${new Date(ev.createdAt).toLocaleDateString('pt-BR')}</div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm btn-navy" data-action="openEvent" data-id="${ev.id}">Abrir</button>
          <button class="icon-btn" data-action="deleteEvent" data-id="${ev.id}">✕</button>
        </div>
      </div>
    `).join('')}
    <div class="card">
      <h3>Novo torneio</h3>
      <label>Nome do torneio</label>
      <input type="text" id="inpEventName" placeholder="Ex: Torneio Verão 2026">
      <button class="btn btn-primary btn-block" style="margin-top:14px;" data-action="createEvent">Criar torneio</button>
    </div>
    <div class="card">
      <h3>Importar torneio de outro aparelho</h3>
      <div class="muted" style="margin-bottom:10px;">Use quando já tiver ativado a sincronização desse torneio em outro celular (aba Histórico → Sincronizar entre aparelhos).</div>
      <label>Master Key (jsonbin.io)</label>
      <input type="password" id="impKey" placeholder="Cole sua Master Key">

        sessionStorage.setItem('volei_unlocked','1');

}

function topN(key, n, filterGender){
  let arr = state.roster.map(p=>({id:p.id, name:p.name, gender:p.gender, val:getStats(p.id)[key]||0}));
  if(filterGender) arr = arr.filter(p=>p.gender===filterGender);
  arr = arr.filter(p=>p.val>0);
  arr.sort((a,b)=>b.val-a.val);
  return arr.slice(0,n);
}
function awardCard(title, key, n, filterGender, bad){
  const list = topN(key,n,filterGender);
  const medals=['🥇','🥈','🥉'];
  return `<div class="award-card ${bad?'bad-award':''}">
    <div class="a-label">${title}</div>
    ${list.length? list.map((p,i)=>`<div class="a-row"><span class="medal">${medals[i]}</span><span class="aname">${p.name}</span><span class="aval">${p.val}</span></div>`).join('')
      : '<div class="muted" style="font-size:12px;">Sem dados ainda</div>'}
  </div>`;
}
function renderStats(){
  if(state.roster.length===0) return `<div class="empty"><div class="big">📊</div>Cadastre participantes e jogue partidas para ver as estatísticas.</div>`;
  let html = `<div class="section-title">Prêmios · categorias boas</div>
  <div class="award-grid">
    ${awardCard('Maior Pontuador Geral','points',3)}
    ${awardCard('Maior Pontuador Masc.','points',3,'M')}
    ${awardCard('Maior Pontuadora Fem.','points',3,'F')}
    ${awardCard('Melhor Saque Geral','aces',3)}
    ${awardCard('Melhor Saque Masc.','aces',3,'M')}
    ${awardCard('Melhor Saque Fem.','aces',3,'F')}
    ${awardCard('Melhor Ataque Geral','attacksGood',3)}
    ${awardCard('Melhor Ataque Masc.','attacksGood',3,'M')}
    ${awardCard('Melhor Ataque Fem.','attacksGood',3,'F')}
    ${awardCard('Melhor Bloqueio','blocks',3)}
  </div>
  <div class="section-title">Categorias a melhorar</div>
  <div class="award-grid">
    ${awardCard('Mais Quinadas','mishits',3,null,true)}
    ${awardCard('Mais Erros de Saque','serveErrors',3,null,true)}
    ${awardCard('Mais Toques na Rede','netTouches',3,null,true)}
  </div>
  <div class="section-title">Tabela geral</div>
  <div class="card">${renderStatTable()}</div>`;
  return html;
}
function renderStatTable(){
  const goodKeys = ['points','aces','attacksGood','blocks','drops'];
  const badKeys = ['attacksBad','netTouches','serveErrors','mishits'];
  const rankMap = {};
  [...goodKeys,...badKeys].forEach(k=>{
    const sorted = state.roster.map(p=>({id:p.id,val:getStats(p.id)[k]||0})).filter(p=>p.val>0).sort((a,b)=>b.val-a.val);
    rankMap[k]={};
    sorted.slice(0,3).forEach((p,i)=>{ rankMap[k][p.id]=i+1; });
  });
  const cols = [
    ['points','Pts'],['aces','Ace'],['attacksGood','Atq✓'],['attacksBad','Atq✗'],
    ['blocks','Blq'],['netTouches','Rede'],['serveErrors','Saq✗'],['mishits','Quin'],['drops','Larg'],['mvp','MVP']
  ];
  const sortedRoster = [...state.roster].sort((a,b)=>(getStats(b.id).points||0)-(getStats(a.id).points||0));
  return `<div class="table-scroll"><table class="stat-table">
    <thead><tr><th>Jogador</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead>
    <tbody>
    ${sortedRoster.map(p=>{
      const s = getStats(p.id);
      return `<tr><td>${p.name}<br><span style="font-size:9px;color:rgba(15,42,61,.5);">${p.team}</span></td>
      ${cols.map(c=>{
        const val = s[c[0]]||0;
        const good = goodKeys.includes(c[0]);
        const bad = badKeys.includes(c[0]);
        let cls='';
        if(good && rankMap[c[0]][p.id]) cls='rank-'+rankMap[c[0]][p.id];
        if(bad && rankMap[c[0]][p.id]) cls='badrank-'+rankMap[c[0]][p.id];
        return `<td class="${cls}">${val}</td>`;
      }).join('')}
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

/* ---------- ACTIONS ---------- */
function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; render(); };
  });
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (e)=>{
      const action = el.dataset.action;
      handleAction(action, el, e);
    };
  });
  const selA = document.getElementById('selTeamA'), selB = document.getElementById('selTeamB');
  const selTarget = document.getElementById('selTarget');
  if(selTarget){
    selTarget.onchange = ()=>{
      document.getElementById('customTargetWrap').style.display = selTarget.value==='custom' ? 'block' : 'none';
    };
  }
  const nameInp = document.getElementById('inpName'), teamInp = document.getElementById('inpTeam');
}

function handleAction(action, el){
  if(action==='switchRole'){
    switchRole();
    return;
  }
  if(action==='switchEvent'){
    currentEventId = null;
    localStorage.removeItem('volei_current_event');
    render();
    return;
  }
  if(action==='openEvent'){
    currentEventId = el.dataset.id;
    localStorage.setItem('volei_current_event', currentEventId);
    loadEventState(currentEventId);
    render();
    pullCloudIfNewer();
    return;
  }
  if(action==='createEvent'){
    const name = document.getElementById('inpEventName').value.trim();
    if(!name){ toast('Dê um nome para o torneio'); return; }
    const events = getEvents();
    const id = uid();
    events.push({id, name, createdAt: new Date().toISOString()});
    saveEvents(events);
    currentEventId = id;
    localStorage.setItem('volei_current_event', id);
    state = defaultState();
    save();
    render();
    toast('Torneio criado!');
    return;
  }
  if(action==='deleteEvent'){
    if(confirm('Isso vai apagar TODOS os dados desse torneio (elenco, jogos, estatísticas). Tem certeza?')){
      const id = el.dataset.id;
      const events = getEvents().filter(e=>e.id!==id);
      saveEvents(events);
      localStorage.removeItem('volei_state_'+id);
      if(currentEventId===id){ currentEventId=null; localStorage.removeItem('volei_current_event'); }
      render();
    }
    return;
  }
  if(action==='openAddPlayer'){ state.modal={type:'addPlayer', gender:'M'}; render(); return; }
  if(action==='closeModal' || action==='overlayClose'){ if(action==='overlayClose'){ state.modal=null; render(); } return; }
  if(action==='setGender'){ state.modal.gender = el.dataset.g; render(); return; }
  if(action==='saveNewPlayer'){
    const name = document.getElementById('inpName').value.trim();
    const team = document.getElementById('inpTeam').value.trim();
    const gender = state.modal.gender;
    if(!name || !team){ toast('Preencha nome e time'); return; }
    state.roster.push({id:uid(), name, team, gender});
    state.modal=null; save(); render(); toast('Participante adicionado');
    return;
  }
  if(action==='deletePlayer'){
    state.roster = state.roster.filter(p=>p.id!==el.dataset.id);
    delete state.playerStats[el.dataset.id];
    save(); render();
    return;
  }
  if(action==='startMatch'){
    const teamA = document.getElementById('selTeamA').value;
    const teamB = document.getElementById('selTeamB').value;
    const bestOf = parseInt(document.getElementById('selBestOf').value,10);
    const targetSel = document.getElementById('selTarget').value;
    let target = targetSel==='custom' ? parseInt(document.getElementById('inpCustomTarget').value,10) : parseInt(targetSel,10);
    if(!target || target<1){ toast('Informe um número válido de pontos por set'); return; }
    if(teamA===teamB){ toast('Escolha times diferentes'); return; }
    state.current = {
      teamA, teamB, bestOf, target,
      sets:[], setsWonA:0, setsWonB:0,
      currentSet:{a:0,b:0},
      log:[],
      matchStats:{}
    };
    save(); render();
    return;
  }
  if(action==='cancelMatch'){
    if(confirm('Cancelar este jogo? O progresso não será salvo.')){
      state.current=null; save(); render();
    }
    return;
  }
  if(action==='pickEventType'){
    state.modal = {type:'pickPlayer', evt:el.dataset.evt};
    render(); return;
  }
  if(action==='choosePlayer'){
    const evt = state.modal.evt;
    const ev = EVENT_TYPES[evt];
    const playerId = el.dataset.id;
    const team = el.dataset.team;
    registerEvent(evt, playerId, team);
    return;
  }
  if(action==='chooseReceiver'){
    const id = el.dataset.id;
    if(id!=='none'){
      const st = matchStat(id);
      st.mishits += 1;
      getStats(id).mishits += 1;
    }
    state.modal=null; save(); render();
    return;
  }
  if(action==='confirmMatch'){
    finalizeMatch();
    return;
  }
  if(action==='publishSnapshot'){
    publishSnapshot();
    return;
  }
  if(action==='saveJsonbinKey'){
    const key = document.getElementById('jbKey').value.trim();
    localStorage.setItem('volei_jsonbin_key', key);
    toast('Chave salva');
    return;
  }
  if(action==='activateSync'){
    activateSync();
    return;
  }
  if(action==='pushCloudNow'){
    pushCloud().then(()=>toast('✅ Sincronizado com a nuvem'));
    return;
  }
  if(action==='importSyncedEvent'){
    importSyncedEvent();
    return;
  }
  if(action==='saveViewerUrl'){
    const url = document.getElementById('jbUrl').value.trim();
    localStorage.setItem('volei_viewer_url', url);
    render();
    toast('Link salvo');
    return;
  }
  if(action==='exportBackup'){
    const data = JSON.stringify(state);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(data).then(()=>toast('Backup copiado! Cole em uma nota segura.')).catch(()=>promptFallback(data));
    } else {
      promptFallback(data);
    }
    return;
  }
  if(action==='importBackup'){
    const raw = prompt('Cole aqui o backup copiado anteriormente:');
    if(!raw) return;
    try{
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      save(); render(); toast('Backup restaurado!');
    }catch(e){ toast('Backup inválido.'); }
    return;
  }
}
function promptFallback(data){
  window.prompt('Copie o texto abaixo (Ctrl+C / segurar e copiar):', data);
}
async function ensureEventBin(key){
  if(state.jsonbin.id) return state.jsonbin.id;
  const res = await fetch('https://api.jsonbin.io/v3/b', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Private':'false','X-Bin-Name':currentEventName()},
    body: JSON.stringify({updatedAt:new Date().toISOString(), standings:[], matches:[], schedule:[]})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.message || ('HTTP '+res.status));
  state.jsonbin = Object.assign({}, state.jsonbin, {id: data.metadata.id});
  save();
  return state.jsonbin.id;
}
async function ensureRegistry(key){
  const existing = getRegistryId();
  if(existing) return existing;
  const res = await fetch('https://api.jsonbin.io/v3/b', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Private':'false','X-Bin-Name':'Índice de Torneios'},
    body: JSON.stringify({tournaments:[]})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.message || ('HTTP '+res.status));
  localStorage.setItem('volei_registry_id', data.metadata.id);
  return data.metadata.id;
}
async function updateRegistry(key, registryId, eventBinId){
  let list = [];
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+registryId+'/latest');
    const data = await res.json();
    list = (data && data.record && data.record.tournaments) || [];
  }catch(e){ /* índice ainda vazio, tudo bem */ }
  const idx = list.findIndex(t=>t.binId===eventBinId);
  const entry = {name: currentEventName(), binId: eventBinId, updatedAt: new Date().toISOString()};
  if(idx>=0) list[idx]=entry; else list.push(entry);
  await fetch('https://api.jsonbin.io/v3/b/'+registryId, {
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':key},
    body: JSON.stringify({tournaments:list})
  });
}
async function publishSnapshot(){
  const key = getJsonbinKey();
  if(!key){ toast('Cole e salve sua Master Key primeiro (card "Conta jsonbin.io")'); return; }
  const teams = teamsList();
  const snapshot = {
    updatedAt: new Date().toISOString(),
    standings: teams.map(t=>({name:t, wins: state.standings[t]||0})).sort((a,b)=>b.wins-a.wins),
    matches: state.history.map(m=>({teamA:m.teamA, teamB:m.teamB, setsWonA:m.setsWonA, setsWonB:m.setsWonB, winner:m.winner})),
    schedule: []
  };
  try{
    const eventBinId = await ensureEventBin(key);
    await fetch('https://api.jsonbin.io/v3/b/'+eventBinId, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':key},
      body: JSON.stringify(snapshot)
    });
    const registryId = await ensureRegistry(key);
    await updateRegistry(key, registryId, eventBinId);
    render();
    toast('✅ Placar publicado! Quem tiver o link fixo já vê este torneio na lista.');
  }catch(e){
    toast('Não foi possível publicar — confira sua conexão e a Master Key.');
  }
}

function matchStat(id){
  const m = state.current;
  if(!m.matchStats[id]) m.matchStats[id] = emptyStats();
  return m.matchStats[id];
}

function registerEvent(evtKey, playerId, playerTeam){
  const m = state.current;
  const ev = EVENT_TYPES[evtKey];
  const player = state.roster.find(p=>p.id===playerId);
  const scoringTeam = ev.point==='self' ? playerTeam : (playerTeam===m.teamA ? m.teamB : m.teamA);

  // credit stat
  matchStat(playerId)[ev.stat] += 1;
  getStats(playerId)[ev.stat] += 1;

  // credit point if this event awards a rally point
  if(scoringTeam===m.teamA) m.currentSet.a += 1; else m.currentSet.b += 1;
  const pointToId = ev.point==='self' ? playerId : null;
  if(scoringTeam===m.teamA || scoringTeam===m.teamB){
    // point goes to the scoring team; individually credited only when it's a "self" point type
  }
  if(ev.point==='self'){
    matchStat(playerId).points += 1;
    getStats(playerId).points += 1;
  }

  m.log.push({
    text:`${player.name}: ${ev.label}`,
    score:`${m.currentSet.a}-${m.currentSet.b}`
  });

  // if it's an ace, offer to pick receiver of the quinada
  if(evtKey==='ace'){
    const opponentTeam = playerTeam===m.teamA ? m.teamB : m.teamA;
    state.modal = {type:'pickReceiver', opponentTeam};
    save(); render();
    return;
  }

  state.modal = null;
  checkSetEnd();
  save(); render();
}

function checkSetEnd(){
  const m = state.current;
  const setsToWin = Math.ceil(m.bestOf/2);
  const target = m.target;
  const {a,b} = m.currentSet;
  const diff = Math.abs(a-b);
  if(a>=target && diff>=2 || b>=target && diff>=2){
    m.sets.push({a,b});
    if(a>b) m.setsWonA+=1; else m.setsWonB+=1;
    m.currentSet = {a:0,b:0};
    m.log = [];
    if(m.setsWonA>=setsToWin || m.setsWonB>=setsToWin){
      // match over
      m.winner = m.setsWonA>m.setsWonB ? m.teamA : m.teamB;
      state.modal = {type:'matchSummary', match:m};
    } else {
      toast(`Set finalizado: ${a}-${b}`);
    }
  }
}

function finalizeMatch(){
  const m = state.current;
  const mvpId = document.getElementById('mvpSelect').value;
  getStats(mvpId).mvp += 1;
  state.standings[m.winner] = (state.standings[m.winner]||0) + 1;
  const mvpName = playerName(mvpId);
  state.history.push({
    teamA:m.teamA, teamB:m.teamB, sets:m.sets, setsWonA:m.setsWonA, setsWonB:m.setsWonB,
    winner:m.winner, mvpName
  });
  state.current = null;
  state.modal = null;
  save(); render();
  toast('Partida salva!');
}

/* ---------- MODO VISUALIZAÇÃO (público, somente leitura) ---------- */
const Public = (function(){
  let screen='list', tab='times', tournaments=[], selected=null, snapshot=null, pollTimer=null;

  function getRegistryId(){ return new URLSearchParams(location.search).get('registry'); }

  function render(){
    const app = document.getElementById('app');
    const title = screen==='tournament' && selected ? selected.name : 'Torneios de Vôlei';
    const sub = screen==='tournament' ? 'toque para voltar à lista ←' : 'escolha um torneio para acompanhar';
    app.innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="ball"></div><h1>${title}</h1></div>
      <div class="sub" data-action="${screen==='tournament'?'pubBack':''}">${sub}</div>
    </div>
    ${screen==='tournament' ? `
      <div class="tabs">
        <div class="tab ${tab==='times'?'active':''}" data-action="pubTab" data-tab="times">Classificação</div>
        <div class="tab ${tab==='jogos'?'active':''}" data-action="pubTab" data-tab="jogos">Próximos jogos</div>
      </div>
      <div class="content">${tab==='times'?renderTimes():renderJogos()}</div>
    ` : `<div class="content">${renderList()}</div>`}
    <div class="content" style="padding-top:0;"><button class="btn btn-ghost btn-block" data-action="switchRole">Sou organizador(a) →</button></div>
    `;
    app.querySelectorAll('[data-action="pubBack"]').forEach(el=>{ el.onclick=goBack; });
    app.querySelectorAll('[data-action="pubTab"]').forEach(el=>{ el.onclick=()=>{ tab=el.dataset.tab; render(); }; });
    app.querySelectorAll('[data-action="openTournament"]').forEach(el=>{
      el.onclick=()=>openTournament(tournaments.find(t=>t.binId===el.dataset.id));
    });
    app.querySelectorAll('[data-action="switchRole"]').forEach(el=>{ el.onclick=switchRole; });
  }

  function renderList(){
    if(!getRegistryId()){
      return `<div class="empty"><div class="big">🔗</div>Nenhum torneio conectado a este link ainda.</div>`;
    }
    if(tournaments.length===0){
      return `<div class="empty"><div class="big">🏐</div>Nenhum torneio publicado ainda.<br>Volte a checar em instantes.</div>`;
    }
    return tournaments.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).map(t=>`
      <div class="card clickable" data-action="openTournament" data-id="${t.binId}">
        <div>
          <div class="tourn-name">${t.name}</div>
          <div class="muted">Atualizado em ${new Date(t.updatedAt).toLocaleString('pt-BR')}</div>
        </div>
        <div class="chevron">›</div>
      </div>`).join('');
  }

  function renderTimes(){
    if(!snapshot || !snapshot.standings || snapshot.standings.length===0){
      return `<div class="empty"><div class="big">🏐</div>Este torneio ainda não tem classificação publicada.</div>`;
    }
    return `<div class="card">
      <h3 style="margin-bottom:10px;">Classificação geral</h3>
      ${snapshot.standings.map((r,i)=>`<div class="standing-row"><div class="pos">${i+1}</div><div class="tname">${r.name}</div><div class="wins">${r.wins}</div></div>`).join('')}
    </div>
    <div class="updated">Atualizado em ${new Date(snapshot.updatedAt).toLocaleString('pt-BR')}</div>
    ${snapshot.matches && snapshot.matches.length ? `<div class="card"><h3 style="margin-bottom:10px;">Últimos resultados</h3>
      ${snapshot.matches.slice().reverse().slice(0,8).map(m=>`<div class="match-row">${m.teamA} ${m.setsWonA}×${m.setsWonB} ${m.teamB} — <span class="win">${m.winner}</span></div>`).join('')}
    </div>`:''}`;
  }

  function renderJogos(){
    return `<div class="empty"><div class="big">📅</div>A tabela de próximos jogos ainda está sendo preparada.<br>Em breve você vai ver aqui os horários e confrontos.</div>`;
  }

  async function fetchRegistry(){
    const id = getRegistryId();
    if(!id) return;
    try{
      const res = await fetch('https://api.jsonbin.io/v3/b/'+id+'/latest');
      const data = await res.json();
      tournaments = (data && data.record && data.record.tournaments) || [];
      if(screen==='list') render();
    }catch(e){ /* mantém a última lista carregada */ }
  }
  async function fetchSnapshot(){
    if(!selected) return;
    try{
      const res = await fetch('https://api.jsonbin.io/v3/b/'+selected.binId+'/latest');
      const data = await res.json();
      if(data && data.record){ snapshot = data.record; if(screen==='tournament') render(); }
    }catch(e){ /* mantém o último placar carregado */ }
  }
  function openTournament(t){
    if(!t) return;
    selected=t; snapshot=null; screen='tournament'; tab='times';
    render(); fetchSnapshot();
    clearInterval(pollTimer);
    pollTimer = setInterval(fetchSnapshot, 15000);
  }
  function goBack(){
    screen='list'; selected=null; snapshot=null;
    clearInterval(pollTimer);
    render(); fetchRegistry();
    pollTimer = setInterval(fetchRegistry, 15000);
  }
  function stopPolling(){ clearInterval(pollTimer); }
  async function start(){
    screen='list'; tab='times';
    render();
    if(!getRegistryId()) return;
    await fetchRegistry();
    pollTimer = setInterval(fetchRegistry, 15000);
  }
  return {load:start, stopPolling};
})();

boot();
})();
</script>
